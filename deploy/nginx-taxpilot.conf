# nginx dla TaxPilot (Django/gunicorn). Listen ustaw na port z Mikrusa.

server {
    listen 44306;
    server_name taxpilot.cytr.us pro01.mikr.us;

    client_max_body_size 10M;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location /static/ {
        alias /home/kwasiucionek/taxpilot/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass         http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE — streaming odpowiedzi czatu (bez buforowania)
        proxy_buffering    off;
        proxy_set_header   X-Accel-Buffering no;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }
}
