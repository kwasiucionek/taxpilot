# Flower za nginx na subdomenie (np. flower-taxpilot.cytr.us) — OPCJONALNE.
# Bezpieczniejsza alternatywa: nie wystawiaj publicznie, wchodz tunelem SSH
# (patrz naglowek taxpilot-flower.service). Jesli wystawiasz — ZOSTAW auth.
server {
    listen <PORT_MIKRUS>;
    server_name flower-taxpilot.cytr.us;

    # (opcjonalnie) druga warstwa auth na nginx — wygeneruj plik hasel:
    #   apt install apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd-flower admin
    # auth_basic "Flower";
    # auth_basic_user_file /etc/nginx/.htpasswd-flower;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Flower uzywa websocketow do aktualizacji na zywo:
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }
}
