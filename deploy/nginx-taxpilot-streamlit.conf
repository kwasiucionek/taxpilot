# nginx dla TaxPilot serwowanego przez Streamlit.
# Streamlit wymaga WebSocketa (/_stcore/stream) — stąd nagłówki Upgrade.
# Listen ustaw na port przypisany przez Mikrusa (tu zostawiony 44306 po uodo).

server {
    listen 44306;
    server_name taxpilot.cytr.us pro01.mikr.us;

    client_max_body_size 10M;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass         http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket — kluczowe dla Streamlita (live update UI)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}
